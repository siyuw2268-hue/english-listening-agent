name: Build listening lesson and publish Pages
on:
  schedule:
    - cron: '5 14 * * *' # 22:05 Beijing, previous evening
  workflow_dispatch:
    inputs:
      target:
        description: Lesson date for manual run
        type: choice
        options: [today, tomorrow]
        default: today
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: english-listening-publish
  cancel-in-progress: false
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install edge-tts
        run: python -m pip install 'edge-tts>=7,<8'
      - name: Generate lesson
        run: python build.py --target "${{ github.event_name == 'schedule' && 'tomorrow' || inputs.target || 'today' }}"
      
      - name: Save published assets and dedup state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add site

          if ! git diff --cached --quiet; then
            git commit -m "Publish English lesson"

            # Sync remote changes before pushing
            git pull --rebase origin main

            # Push the updated branch
            git push origin HEAD:main
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4

