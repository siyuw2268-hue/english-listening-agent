<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Daily English Listening</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#263448;background:#f8fafc}*{box-sizing:border-box}body{margin:0;padding:28px 16px}.shell{max-width:820px;margin:auto}.eyebrow{font-size:12px;letter-spacing:.13em;font-weight:700;color:#718096}h1{font-size:clamp(26px,5vw,34px);letter-spacing:-.035em;margin:13px 0 6px}p{color:#738194}.panel{background:#fff;border:1px solid #e5eaf0;border-radius:22px;padding:26px;margin-top:22px;box-shadow:0 10px 32px #26344808}.subtitles{min-height:230px;display:flex;align-items:center;justify-content:center;text-align:center;padding:15px}.en{font-size:clamp(22px,4vw,31px);line-height:1.55;font-weight:500}.controls{border-top:1px solid #edf0f4;padding-top:22px}.buttons{display:flex;align-items:center;justify-content:center;gap:28px;margin-bottom:20px}button,select{font:inherit}button{cursor:pointer;border:0;background:none;color:#53647a}.jump{font-size:23px}.play{background:#334155;color:white;width:64px;height:64px;border-radius:50%;font-size:24px}.progress{width:100%;accent-color:#64748b}.meta,.settings{display:flex;justify-content:space-between;gap:12px;color:#758396;font-size:13px;margin-top:12px}.settings{margin-top:22px;flex-wrap:wrap}select{padding:8px;border:1px solid #dce3eb;border-radius:9px;background:#fff;color:#344256}.transcript{max-height:310px;overflow:auto;border-top:1px solid #edf0f4;margin-top:22px;padding-top:10px}.line{padding:12px 14px;border-radius:10px;cursor:pointer}.line.active{background:#eef3f8}.time{font-size:11px;color:#8794a6;margin-bottom:4px}.line .text{font-size:14px}.muted{color:#94a3b8}.sources a{display:block;color:#53647a;margin:10px 0;overflow-wrap:anywhere}.foot{text-align:center;font-size:12px;margin:24px 0;color:#94a3b8}@media(max-width:600px){.panel{padding:17px}.subtitles{min-height:215px}}
</style></head><body><main class="shell"><div class="eyebrow">ENGLISH LISTENING / CLOUD EDITION</div><h1 id="title">Today's Listening</h1><p>British English · Sonia · Minimal Edition</p><section class="panel"><div id="day" class="eyebrow">Loading...</div><div class="subtitles"><div class="en" id="english"><span class="muted">正在载入今日英语听力…</span></div></div><div class="controls"><div class="buttons"><button class="jump" id="back" aria-label="后退5秒">↶</button><button class="play" id="play" aria-label="播放暂停">▶</button><button class="jump" id="next" aria-label="前进5秒">↷</button></div><input class="progress" id="seek" type="range" min="0" max="1000" value="0" aria-label="播放进度"><div class="meta"><span id="clock">00:00 / 00:00</span><span id="status">Ready</span></div><div class="settings"><label>播放速度 <select id="speed"><option value="0.75">0.75×</option><option value="0.85">0.85×</option><option value="1" selected>1.0×</option><option value="1.15">1.15×</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option></select></label><label>字幕 <select id="mode"><option value="en">英文</option><option value="none">关闭</option></select></label></div></div><div class="transcript" id="transcript">正在加载字幕…</div></section><section class="panel"><strong>新闻来源</strong><div class="sources" id="sources"></div><p class="muted">内容来自公开 RSS 标题与摘要，并非完整新闻原文。中文翻译暂不提供。</p></section><section class="panel"><strong>最近 14 天</strong><div id="history"></div></section><div class="foot">Cloud hosted · No OpenAI API key · Public news only</div><audio id="audio" preload="metadata"></audio></main><script>
const $=id=>document.getElementById(id),audio=$('audio');let en=[],current=-1,loaded=null;
function parseTime(s){let m=s.trim().match(/(\d+):(\d+):(\d+)[,.](\d+)/);return m?+m[1]*3600 + +m[2]*60 + +m[3] + +m[4]/1000:0}
function parseSrt(s){return s.replace(/\r/g,'').replace(/^\uFEFF/,'').split(/\n\s*\n/).map(b=>{let lines=b.trim().split('\n'),i=lines.findIndex(x=>x.includes('-->'));if(i<0)return null;let t=lines[i].split('-->');return {start:parseTime(t[0]),end:parseTime(t[1]),text:lines.slice(i+1).join(' ').replace(/<[^>]+>/g,'').trim()}}).filter(Boolean)}
function fmt(t){if(!isFinite(t))t=0;return String(Math.floor(t/60)).padStart(2,'0')+':'+String(Math.floor(t%60)).padStart(2,'0')}
function renderList(){let el=$('transcript');el.replaceChildren();en.forEach((c,i)=>{let d=document.createElement('div');d.className='line';d.dataset.index=i;let t=document.createElement('div');t.className='time';t.textContent=fmt(c.start);let s=document.createElement('div');s.className='text';s.textContent=c.text;d.append(t,s);d.onclick=()=>{audio.currentTime=c.start;if(audio.paused)audio.play().catch(()=>{});update()};el.append(d)})}
function update(){let t=audio.currentTime||0,d=audio.duration||0;$('seek').value=d?Math.round(t/d*1000):0;$('clock').textContent=fmt(t)+' / '+fmt(d);let i=en.findIndex(c=>t>=c.start&&t<c.end);if(i!==current){$('transcript').querySelector('.active')?.classList.remove('active');current=i;let line=$('transcript').querySelector('[data-index="'+i+'"]');line?.classList.add('active');if(line&&!audio.paused)line.scrollIntoView({block:'nearest',behavior:'smooth'})}let c=en[i];$('english').textContent=$('mode').value==='none'?'':(c?.text||'…');$('play').textContent=audio.paused?'▶':'Ⅱ'}
async function load(date){try{let path=date?'generated/'+encodeURIComponent(date)+'.json':'latest.json';let r=await fetch(path,{cache:'no-store'});if(!r.ok)throw Error('No lesson found');let m=await r.json();if(!/^\d{4}-\d{2}-\d{2}$/.test(m.date))throw Error('Invalid lesson date');let s=await fetch(m.srt,{cache:'no-store'});if(!s.ok)throw Error('SRT not found');en=parseSrt(await s.text());if(!en.length)throw Error('SRT is empty');loaded=m;current=-1;audio.src=m.audio;audio.load();$('title').textContent=m.title;$('day').textContent=m.date;$('status').textContent='Ready';renderList();update();let sources=$('sources');sources.replaceChildren();(m.sources||[]).forEach(x=>{let a=document.createElement('a');a.textContent=x.title;a.href=x.url;a.target='_blank';a.rel='noopener noreferrer';sources.append(a)});history.replaceState(null,'','?listen='+m.date)}catch(e){$('english').textContent='无法加载听力：'+e.message;$('status').textContent='Error'}}
$('play').onclick=()=>{if(audio.paused)audio.play().catch(e=>$('status').textContent=e.message);else audio.pause()};$('back').onclick=()=>audio.currentTime=Math.max(0,audio.currentTime-5);$('next').onclick=()=>audio.currentTime=Math.min(audio.duration||0,audio.currentTime+5);$('seek').oninput=e=>{if(audio.duration)audio.currentTime=audio.duration*(+e.target.value)/1000};$('speed').onchange=e=>audio.playbackRate=+e.target.value;$('mode').onchange=update;['timeupdate','loadedmetadata','play','pause','seeked','ended'].forEach(e=>audio.addEventListener(e,update));
(async()=>{let date=new URLSearchParams(location.search).get('listen');if(date&&!/^\d{4}-\d{2}-\d{2}$/.test(date))date=null;await load(date);try{let r=await fetch('state.json',{cache:'no-store'}),state=await r.json();let el=$('history');(state.history||[]).forEach(h=>{let a=document.createElement('a');a.href='?listen='+encodeURIComponent(h.date);a.textContent=h.date+' · '+h.title;a.style.display='block';a.style.margin='12px 0';el.append(a)})}catch(e){}})();
</script></body></html>
